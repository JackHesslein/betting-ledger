<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="theme-color" content="#12181c" />
<title>The Ledger</title>
<style>
  :root {
    --bg: #12181c;
    --surface: #1a2126;
    --surface-2: #1f272d;
    --rule: #2c363d;
    --rule-soft: #232b31;
    --text: #e9e6df;
    --muted: #8b939b;
    --brass: #c9a227;
    --brass-soft: #8a742f;
    --up: #5fa87e;
    --down: #c06a4f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    overscroll-behavior-y: contain;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .header { text-align: center; margin-bottom: 22px; }
  .header .eyebrow {
    font-family: 'IBM Plex Mono', monospace; letter-spacing: .18em; font-size: 11px;
    color: var(--brass); text-transform: uppercase;
  }
  .header h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; margin: 6px 0 4px; }
  .header p { color: var(--muted); font-size: 13px; margin: 0; }
 
  .cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 15px 17px; }
  .card-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .card-net { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; font-size: 26px; }
  .card.big .card-net { font-size: 32px; }
  .card-net.up { color: var(--up); } .card-net.down { color: var(--down); }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .dot { margin: 0 6px; opacity: .6; }
 
  .icon-svg { width: 1em; height: 1em; flex-shrink: 0; }
 
  .add-toggle {
    width: 100%; background: var(--surface); border: 1px dashed var(--rule); color: var(--brass);
    border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .add-toggle:active { background: var(--surface-2); }
 
  .form { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; margin-top: 10px; display: none; }
  .form.open { display: block; animation: reveal .18s ease; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace; letter-spacing: .05em; }
  .form input {
    width: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px;
    padding: 10px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 16px;
  }
  .form-full { margin-bottom: 10px; }
  .error { color: var(--down); font-size: 12px; margin-bottom: 10px; min-height: 14px; }
  .form-actions { display: flex; gap: 8px; }
  .btn-primary { flex: 1; background: var(--brass); color: #1a1405; border: none; border-radius: 6px; padding: 11px; font-weight: 600; font-size: 14px; }
  .btn-secondary { background: transparent; border: 1px solid var(--rule); color: var(--muted); border-radius: 6px; padding: 11px 16px; font-size: 14px; }
 
  .register { margin-top: 26px; }
  .month-heading { display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: var(--brass); margin: 20px 0 6px; }
  .month-heading::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .row { display: flex; align-items: center; gap: 8px; padding: 10px 2px; border-bottom: 1px solid var(--rule-soft); }
  .row-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); width: 30px; flex-shrink: 0; }
  .row-desc { flex: 1; font-size: 14px; min-width: 0; }
  .row-desc .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row-net { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; width: 70px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .row-net.up { color: var(--up); } .row-net.down { color: var(--down); }
  .row-balance { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); width: 66px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .row-del { background: none; border: none; color: var(--muted); padding: 6px; flex-shrink: 0; }
  .row-del:active { color: var(--down); }
 
  .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 13px; }
  .empty .big { font-family: 'Fraunces', serif; font-size: 17px; color: var(--text); margin-bottom: 6px; }
  .saving-note { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 6px; height: 14px; }
 
  .install-tip {
    background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px;
    padding: 12px 14px; font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.5;
  }
  .install-tip b { color: var(--brass); }
  .install-tip button { background: none; border: none; color: var(--muted); float: right; font-size: 12px; text-decoration: underline; padding: 0; }
 
  .backup-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-ghost {
    flex: 1; background: transparent; border: 1px solid var(--rule); color: var(--muted);
    border-radius: 8px; padding: 9px; font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    letter-spacing: .03em; cursor: pointer;
  }
  .btn-ghost:active { border-color: var(--brass-soft); color: var(--brass); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="eyebrow">Personal Ledger</div>
    <h1>The Ledger</h1>
    <p>Every bet, staked and settled. Nothing else.</p>
  </div>
 
  <div id="installTip" class="install-tip" style="display:none;"></div>
 
  <div class="cards">
    <div class="card big"><div class="card-label">This Month</div><div class="card-net" id="monthNet"></div><div class="card-meta" id="monthMeta1"></div><div class="card-meta" id="monthMeta2"></div></div>
    <div class="card"><div class="card-label">This Year</div><div class="card-net" id="yearNet"></div><div class="card-meta" id="yearMeta1"></div><div class="card-meta" id="yearMeta2"></div></div>
    <div class="card"><div class="card-label">All Time</div><div class="card-net" id="allNet"></div><div class="card-meta" id="allMeta1"></div><div class="card-meta" id="allMeta2"></div></div>
  </div>
 
  <button class="add-toggle" id="addToggle">
    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Add a bet
  </button>
 
  <div class="backup-row">
    <button class="btn-ghost" id="exportBtn">Export backup</button>
    <button class="btn-ghost" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>
 
  <div class="form" id="form">
    <div class="form-row">
      <div><label>Date</label><input type="date" id="fDate" /></div>
      <div><label>Stake</label><input type="number" inputmode="decimal" placeholder="0.00" id="fStake" /></div>
    </div>
    <div class="form-full"><label>Description</label><input type="text" placeholder="e.g. Lakers -4.5" id="fDesc" /></div>
    <div class="form-full"><label>Amount returned (0 if it lost)</label><input type="number" inputmode="decimal" placeholder="0.00" id="fReturned" /></div>
    <div class="error" id="fError"></div>
    <div class="form-actions">
      <button class="btn-primary" id="fSave">Save bet</button>
      <button class="btn-secondary" id="fCancel">Cancel</button>
    </div>
  </div>
 
  <div class="saving-note" id="savingNote"></div>
 
  <div class="register" id="register"></div>
</div>
 
<script>
(function () {
  const STORAGE_KEY = "ledger:entries";
  let entries = [];
  let loaded = false;
 
  const $ = (id) => document.getElementById(id);
  const money = (n) => (n < 0 ? "-" : "") + "$" + Math.abs(n).toFixed(2);
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  };
  const monthLabel = (key) => {
    const [y,m] = key.split("-");
    const d = new Date(Number(y), Number(m)-1, 1);
    return d.toLocaleDateString("en-US",{month:"long",year:"numeric"}).toUpperCase();
  };
  const uid = () => Date.now() + "-" + Math.random().toString(36).slice(2,8);
 
  const upIcon = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>';
  const downIcon = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/></svg>';
  const flatIcon = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>';
  const trashIcon = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>';
 
  // window.storage only exists inside Claude's in-chat preview. Once this file
  // is downloaded and opened directly in your phone's browser, it won't be
  // there — so we fall back to the browser's own local storage, which is the
  // correct persistence mechanism for a standalone page like this one.
  const hasClaudeStorage = typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function";
 
  async function loadEntries() {
    try {
      if (hasClaudeStorage) {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (Array.isArray(parsed)) entries = parsed;
        }
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) entries = parsed;
        }
      }
    } catch (e) { /* no data yet */ }
    loaded = true;
    render();
  }
 
  async function saveEntries() {
    $("savingNote").textContent = "saving…";
    try {
      if (hasClaudeStorage) {
        await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }
    } catch (e) {
      $("savingNote").textContent = "couldn't save on this device";
      return;
    }
    $("savingNote").textContent = "";
  }
 
  function summarize(list) {
    const staked = list.reduce((s,e) => s + e.stake, 0);
    const returned = list.reduce((s,e) => s + e.returned, 0);
    const net = returned - staked;
    const wins = list.filter(e => e.net > 0).length;
    const decided = list.filter(e => e.net !== 0).length;
    const winRate = decided ? Math.round((wins/decided)*100) : null;
    return { staked, returned, net, count: list.length, winRate };
  }
 
  function fillCard(prefix, sum) {
    const netEl = $(prefix+"Net");
    netEl.className = "card-net" + (sum.net>0?" up":sum.net<0?" down":"");
    netEl.innerHTML = money(sum.net) + (sum.net>0?upIcon:sum.net<0?downIcon:flatIcon);
    $(prefix+"Meta1").textContent = money(sum.staked) + " staked · " + money(sum.returned) + " returned";
    $(prefix+"Meta2").textContent = sum.count + " bet" + (sum.count===1?"":"s") + (sum.winRate!==null ? " · " + sum.winRate + "% win rate" : "");
  }
 
  function render() {
    const chrono = [...entries].sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    let running = 0;
    const withBalance = chrono.map(e => {
      const net = e.returned - e.stake;
      running += net;
      return Object.assign({}, e, { net, balance: running });
    });
    const byId = {};
    withBalance.forEach(e => byId[e.id] = e);
 
    const now = new Date();
    const curMonthKey = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
    const curYear = String(now.getFullYear());
 
    fillCard("month", summarize(withBalance.filter(e => e.date.slice(0,7) === curMonthKey)));
    fillCard("year", summarize(withBalance.filter(e => e.date.slice(0,4) === curYear)));
    fillCard("all", summarize(withBalance));
 
    const groupsMap = {};
    [...withBalance].reverse().forEach(e => {
      const key = e.date.slice(0,7);
      (groupsMap[key] = groupsMap[key] || []).push(e);
    });
    const groupKeys = Object.keys(groupsMap).sort((a,b) => b.localeCompare(a));
 
    const reg = $("register");
    if (!loaded) {
      reg.innerHTML = '<div class="empty">Loading your ledger…</div>';
      return;
    }
    if (groupKeys.length === 0) {
      reg.innerHTML = '<div class="empty"><div class="big">Nothing logged yet</div>Add your first bet above to start tracking.</div>';
      return;
    }
    let html = "";
    groupKeys.forEach(key => {
      html += '<div class="month-heading">' + monthLabel(key) + '</div>';
      groupsMap[key].forEach(e => {
        const d = new Date(e.date + "T00:00:00");
        const day = d.toLocaleDateString("en-US",{day:"2-digit"});
        html += '<div class="row">' +
          '<div class="row-date">'+day+'</div>' +
          '<div class="row-desc">'+escapeHtml(e.description)+'<div class="sub">'+money(e.stake)+' → '+money(e.returned)+'</div></div>' +
          '<div class="row-net '+(e.net>0?"up":e.net<0?"down":"")+'">'+(e.net>0?"+":"")+money(e.net)+'</div>' +
          '<div class="row-balance">'+money(e.balance)+'</div>' +
          '<button class="row-del" data-id="'+e.id+'">'+trashIcon+'</button>' +
        '</div>';
      });
    });
    reg.innerHTML = html;
    reg.querySelectorAll(".row-del").forEach(btn => {
      btn.addEventListener("click", () => {
        entries = entries.filter(e => e.id !== btn.dataset.id);
        saveEntries();
        render();
      });
    });
  }
 
  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }
 
  // Form handling
  $("fDate").value = todayStr();
  $("addToggle").addEventListener("click", () => {
    $("form").classList.add("open");
    $("addToggle").style.display = "none";
  });
  $("fCancel").addEventListener("click", closeForm);
  function closeForm() {
    $("form").classList.remove("open");
    $("addToggle").style.display = "flex";
    $("fError").textContent = "";
  }
  $("fSave").addEventListener("click", () => {
    const date = $("fDate").value;
    const stake = parseFloat($("fStake").value);
    const returnedRaw = $("fReturned").value;
    const returned = returnedRaw === "" ? 0 : parseFloat(returnedRaw);
    if (!date || isNaN(stake) || stake <= 0) {
      $("fError").textContent = "Enter a date and a stake greater than 0.";
      return;
    }
    entries.push({
      id: uid(),
      date,
      description: ($("fDesc").value || "").trim() || "Untitled bet",
      stake,
      returned: isNaN(returned) ? 0 : returned
    });
    saveEntries();
    render();
    $("fDate").value = todayStr();
    $("fStake").value = "";
    $("fDesc").value = "";
    $("fReturned").value = "";
    closeForm();
  });
 
  // Export / import backup, so data isn't trapped in one browser's storage
  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    a.href = url;
    a.download = "ledger-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
 
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("bad format");
        const existingIds = new Set(entries.map(en => en.id));
        const incoming = parsed.filter(en => en && en.id && en.date && !existingIds.has(en.id));
        entries = entries.concat(incoming);
        saveEntries();
        render();
        alert("Imported " + incoming.length + " bet" + (incoming.length===1?"":"s") + ".");
      } catch (err) {
        alert("Couldn't read that file — make sure it's a backup exported from this app.");
      }
      $("importFile").value = "";
    };
    reader.readAsText(file);
  });
 
  // Dynamic app icon (canvas -> apple-touch-icon / favicon) so "Add to Home Screen" gets a real icon
  function buildIcon() {
    const canvas = document.createElement("canvas");
    canvas.width = 180; canvas.height = 180;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#12181c";
    ctx.fillRect(0,0,180,180);
    ctx.strokeStyle = "#c9a227";
    ctx.lineWidth = 4;
    ctx.strokeRect(14,14,152,152);
    ctx.fillStyle = "#c9a227";
    ctx.font = "600 96px Georgia, serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("L", 90, 100);
    const url = canvas.toDataURL("image/png");
    ["apple-touch-icon","icon"].forEach(rel => {
      const link = document.createElement("link");
      link.rel = rel;
      link.href = url;
      document.head.appendChild(link);
    });
  }
  buildIcon();
 
  // Best-effort web manifest so Android's "Add to Home Screen" can pick up standalone display
  try {
    const manifest = {
      name: "The Ledger",
      short_name: "Ledger",
      start_url: ".",
      display: "standalone",
      background_color: "#12181c",
      theme_color: "#12181c",
      icons: []
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (e) {}
 
  // Install tip (dismissible)
  function showInstallTip() {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const tip = $("installTip");
    tip.style.display = "block";
    tip.innerHTML = isIOS
      ? '<b>Add to your home screen:</b> tap the Share icon, then "Add to Home Screen." <button id="dismissTip">Got it</button>'
      : '<b>Add to your home screen:</b> open your browser menu and choose "Add to Home Screen" or "Install app." <button id="dismissTip">Got it</button>';
    $("dismissTip").addEventListener("click", () => { tip.style.display = "none"; });
  }
  showInstallTip();
 
  loadEntries();
})();
</script>
</body>
</html>
